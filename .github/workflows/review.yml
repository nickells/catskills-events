name: Review

# Reviews each PR when it opens or leaves draft. Comment "/review" on a PR for a fresh review.
# Fork PRs get no secrets, so they're only reviewed when a collaborator comments "/review". The
# action reads the diff through the API and never runs the PR's code.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: nickells/review-bot@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
