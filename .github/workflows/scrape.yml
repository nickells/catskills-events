name: Scrape & Deploy

on:
  push:
    branches: [main] # site-only redeploy of the published events
  schedule:
    - cron: "0 10 * * *" # 10 AM UTC (6 AM ET) daily
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraping and redeploy the currently published events (for site-only changes)"
        type: boolean
        default: false

permissions:
  contents: write # commits lib/discovered-sources.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    env:
      SKIP_SCRAPE: ${{ github.event_name == 'push' || inputs.skip_scrape == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        if: env.SKIP_SCRAPE != 'true'
      - run: npx playwright install --with-deps chromium
        if: env.SKIP_SCRAPE != 'true'
      - name: Restore scrape cache
        if: env.SKIP_SCRAPE != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/scrape-cache.json
          key: scrape-cache-${{ github.run_id }}
          restore-keys: scrape-cache-
      - run: node run.mjs
        if: env.SKIP_SCRAPE != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
      - name: Commit discovered sources
        if: env.SKIP_SCRAPE != 'true'
        continue-on-error: true # never block the cache save and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lib/discovered-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Update discovered Instagram sources"
            git pull --rebase --autostash
            git push
          fi
      - name: Save scrape cache
        if: env.SKIP_SCRAPE != 'true'
        uses: actions/cache/save@v4
        with:
          path: output/scrape-cache.json
          key: scrape-cache-${{ github.run_id }}
      - name: Fetch published events
        if: env.SKIP_SCRAPE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url)
          mkdir -p output
          for f in events.json events.md; do
            curl -fsSL "${site%/}/output/$f" -o "output/$f"
          done
          node -e 'const a = JSON.parse(require("fs").readFileSync("output/events.json")); if (!a.length) throw new Error("no events"); console.log(`${a.length} published events`)'
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html sources.html _site/
          cp -r output _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
      - uses: actions/deploy-pages@v5
        id: deployment
