# For people with GitHub; api.mjs opens the same issue for requests from the Sources page.
# Labeling it `approved` adds the account (approve-venue.yml), which parses the field labels
# (lib/requests.mjs): keep them in sync. The label must exist in the repo, or GitHub drops it.
name: Add a venue
description: Suggest an Instagram account that posts events in the Catskills or Hudson Valley.
title: Add a venue
labels: [venue-request]
body:
  - type: markdown
    attributes:
      value: |
        Every morning a script reads event posts from local venues' Instagram accounts. Tell us one we're missing and we'll take a look.
  - type: input
    id: handle
    attributes:
      label: Instagram account
      placeholder: "@yourvenue"
    validations:
      required: true
  - type: input
    id: town
    attributes:
      label: Town
      description: Where most of its events are. Optional.
      placeholder: Phoenicia
